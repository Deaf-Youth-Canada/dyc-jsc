name: Sync public calendar and publish website
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Verify calendar conversion
        run: python -m unittest discover -s tests
      - name: Refresh public events
        id: sync
        continue-on-error: true
        run: python scripts/sync_calendar.py
      - name: Preserve snapshot and decide whether to publish
        id: changes
        env:
          TRIGGER: ${{ github.event_name }}
          SYNC_RESULT: ${{ steps.sync.outcome }}
        run: |
          if [ "$SYNC_RESULT" != success ]; then
            echo '::warning::Calendar refresh failed. Retaining the last successful public snapshot.'
            test -s events.json
          fi
          if ! git diff --quiet -- events.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add events.json
            git commit -m 'Refresh public calendar snapshot'
            git push origin HEAD:main
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [ "$TRIGGER" != schedule ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare static website
        if: steps.changes.outputs.publish == 'true'
        run: |
          mkdir _site
          cp *.html *.css *.js *.png events.json CNAME _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.publish == 'true'
        with:
          path: _site
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
